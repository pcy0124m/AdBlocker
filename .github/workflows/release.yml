name: Build & Sign AdBlocker Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# 创建 Release 需要写权限；若仓库默认 token 为只读，必须显式声明
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: app/release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 注意：sdkmanager 没有 --accept-license 参数，需先用 --licenses 接受许可。
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 未配置。请先在仓库 Settings → Secrets and variables → Actions 添加 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个密钥。"
            exit 1
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 使用仓库自带的 Gradle Wrapper（8.6），不再手动 curl 安装 Gradle。
      - name: Build signed release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: adblocker-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: adblocker-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # 把产物整理成易识别的文件名，供 Release 附件使用
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/AdBlocker-release.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/AdBlocker-release.aab
          ls -lh release-assets

      # 关键一步：创建 GitHub Release，让签名包出现在仓库的 Releases 页面（可直接下载，
      # 不像 Actions artifacts 那样必须登录后在 Actions 页里翻找）。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "Publishing release with tag: $TAG"

          cat > release-notes.md <<EOF
          已签名的 Android 安装包，由 GitHub Actions 自动构建。

          - 构建来源：run #${GITHUB_RUN_NUMBER}
          - 提交：\`${GITHUB_SHA}\`
          - 签名：由 CI Secrets 中的 keystore 完成

          | 文件 | 用途 |
          |---|---|
          | \`AdBlocker-release.apk\` | 签名版 APK，直接安装到手机 |
          | \`AdBlocker-release.aab\` | 签名版 AAB，用于上架应用商店 |

          > 未签名的 debug 包不在此处，可在本仓库 Actions 页面对应 run 的 Artifacts 中下载。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets with --clobber"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "AdBlocker $TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
