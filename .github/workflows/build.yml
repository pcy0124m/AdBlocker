name: Build AdBlocker Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 注意：sdkmanager 没有 --accept-license 参数（旧版常被误用），
      # 正确做法是先用 --licenses 接受许可，再 --install 安装包。
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 使用仓库自带的 Gradle Wrapper（gradlew + gradle-wrapper.jar 8.6），
      # 不再手动 curl 安装 Gradle。
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adblocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
